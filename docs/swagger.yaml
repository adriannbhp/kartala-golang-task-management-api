paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginParameter'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerLoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
      security:
      - ApiKeyAuth: []
      summary: Login user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed successfully
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerLoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Invalid or expired token
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
      security:
      - ApiKeyAuth: []
      summary: Refresh access token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with username and email
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterParameter'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerRegisterResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "409":
          description: Conflict (Email or Username already exists)
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
      security:
      - ApiKeyAuth: []
      summary: Register a new user
      tags:
      - auth
  /api/v1/tasks:
    get:
      consumes:
      - application/json
      description: Get a paginated list of tasks for the authenticated user with optional
        filtering
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Sorting field (e.g. title asc, created_at desc)
        in: query
        name: sort
        type: string
      - description: Filter by status (todo, in_progress, done)
        in: query
        name: status
        type: string
      - description: Filter by title (ILike search)
        in: query
        name: title
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerTasksPaginationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerInternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get all tasks
      tags:
      - Tasks
    post:
      consumes:
      - application/json
      description: Create a new task for the authenticated user
      parameters:
      - description: Task data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_tasks.CreateTaskParameter'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerInternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Create a new task
      tags:
      - Tasks
  /api/v1/tasks/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a task by its ID
      parameters:
      - description: Task ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerDeleteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerInternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Delete task
      tags:
      - Tasks
    get:
      consumes:
      - application/json
      description: Get details of a specific task by its ID
      parameters:
      - description: Task ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerInternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get task by ID
      tags:
      - Tasks
    put:
      consumes:
      - application/json
      description: Update an existing task by its ID
      parameters:
      - description: Task ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Updated task data
        in: body
        name: task
        required: true
        schema:
          $ref: '#/definitions/internal_tasks.UpdateTaskParameter'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerTaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerBadRequestResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerNotFoundResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerInternalErrorResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Update task
      tags:
      - Tasks
  /api/v1/users/me:
    get:
      consumes:
      - application/json
      description: Get profile information for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: User info retrieved successfully
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUserMeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerUnauthorizedResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/github_com_adriannbhp_kartala-golang-task-management-api_pkg_response.SwaggerNotFoundResponse'
      security:
      - ApiKeyAuth: []
      - BearerAuth: []
      summary: Get current user info
      tags:
      - users
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-KEY
    type: apiKey
  BearerAuth:
    description: Type "Bearer" followed by a space and then your token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
